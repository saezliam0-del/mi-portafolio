<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculadora.css">
</head>
<body>

    <div class="calculadora">

        <div class="pantalla" id="pantalla">0</div>
        
        <button class="btn" id="botonC">C</button>
        <button class="btn" id="borrar">←</button>
        <button class="btn" id="botonPORCENTAJE">%</button>
        <button class="btn" id="botonBARRA">/</button>
        <button class="btn" id="boton7">7</button>
        <button class="btn" id="boton8">8</button>
        <button class="btn" id="boton9">9</button>
        <button class="btn" id="botonASTERISCO">*</button>
        <button class="btn" id="boton4">4</button>
        <button class="btn" id="boton5">5</button>
        <button class="btn" id="boton6">6</button>
        <button class="btn" id="botonMENOS">-</button>
        <button class="btn" id="boton1">1</button>
        <button class="btn" id="boton2">2</button>
        <button class="btn" id="boton3">3</button>
        <button class="btn" id="botonMAS">+</button>
        <button class="btn" id="boton0">0</button>
        <button class="btn" id="botonPUNTO">.</button>
        <button class="btn" id="botonIGUAL">=</button>

    </div>

    <script src="script.js"></script>




</body>
</html>
